name: Build & Release Nothing APK

on:
  push:
    branches: [ "nothing" ]
    paths:
      - 'app/**'
      - 'ModuleBase/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release iconify_nothing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache debug keystore (for in-place APK updates)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nothing-debug-keystore-v1

      - name: Cache incremental Kotlin/KSP build state
        uses: actions/cache@v4
        with:
          path: |
            app/build/kotlin
            app/build/kspCaches
            app/build/generated
            app/build/tmp/kotlin-classes
            app/build/intermediates/compiled_local_resources
            app/build/intermediates/dex
            app/build/intermediates/merged_res
          key: nothing-inc-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}-${{ github.run_id }}
          restore-keys: |
            nothing-inc-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}-
            nothing-inc-

      - name: Configure Gradle cache and heap
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "kotlin.incremental=true" >> ~/.gradle/gradle.properties
          echo "ksp.incremental=true" >> ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write sign info
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Build Standard Release APK (fast)
        run: ./gradlew assembleStandardRelease -PskipMinify -PnothingVersionCode=${{ github.run_number }} -Pandroid.enableResourceOptimizations=false --build-cache

      - name: Rename APK
        run: |
          set -e
          STANDARD_DIR="app/build/outputs/apk/standard/release"
          APK_FILE=$(ls "$STANDARD_DIR"/*.apk | head -n 1)
          mv "$APK_FILE" "$STANDARD_DIR/iconify_nothing_v${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iconify_nothing_v${{ github.run_number }}
          name: iconify_nothing_v${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/standard/release/iconify_nothing_v${{ github.run_number }}.apk
